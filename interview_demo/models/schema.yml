
version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'cancelled']

  - name: customer_revenue
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: total_revenue
        data_tests:
          - not_null

